          <style>
          
            .container {
                 width: 100%;
                 margin: 0;
                 text-align: center;
                 padding: 0;
            }
            .cont {
                position: sticky;
                top: 0; /* Adjust this value as needed */
                background-color: white; /* Or any color of your choice */
                z-index: 1000; /* Ensures the header stays on top of other content */
                padding: 10px;
                width: 95%;
                margin: auto;
                text-align: center;
                box-shadow: 0px 2px 5px rgba(0,0,0,0.2); /* Optional: Adds a shadow for better visibility */
            }

             .slider {
                 width: 100%;
                 height: 25px;
                 background: #ddd;
                 outline: none;
                 opacity: 0.7;
                 -webkit-transition: .2s;
                 transition: opacity .2s;
            }
            .slider:hover {
                 opacity: 1;
            }
            label {
                 display: block;
                 margin-bottom: 10px;
                 font-weight: bold;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed; /* This will allow us to set fixed widths for columns */
                margin-top: 70px; /* Add margin to account for the fixed .container height */
            }

            th, td {
                border: 1px solid #ddd;
                padding: 2px;
                text-align: left;
            }
            th {
                background-color: #f2f2f2;
                position: sticky;
                top: 80px; /* Adjust based on the height of your .container */
                z-index: 20; /* Ensures headers are above the container */
            }

            td:first-child, th:first-child {
                background-color: #e7f3ff; /* Color for the first column */
                width: 30%; /* Width of the first column */
            }

            td, th {
                width: 18%; /* Width for the rest of the columns */
            }

            .group-header {
                font-weight: bold;
                background-color: #f9f9f9;
                text-align: center;
            }
            
            .positive {
                color: green;
            }

            .negative {
                color: red;
            }

            @media screen and (max-width: 600px) {
                 th, td {
                     padding: 8px;
                     font-size: 12px;
                }
            }
             .card {
                 margin-top: 20px;
                 border: 1px solid #ddd;
                 border-radius: 5px;
                 padding: 8px;
                 background-color: #f9f9f9;
            }
            .card-row {
                 border-bottom: 1px solid #eee;
                 padding: 8px 0;
            }
            .card-row:last-child {
                 border-bottom: none;
            }
            @media screen and (max-width: 600px) {
                 .card-row {
                     font-size: 12px;
                }
            }
            .bold-row td {
                font-weight: bold;
            }

            .password-container {
                position: relative;
                display: inline-block;
            }
            .password-container input[type="password"],
            .password-container input[type="text"] {
                padding-right: 10px;
                font-size: 18px;
            }
            .toggle-password {
                position: absolute;
                top: 35%;
                right: 10px;
                transform: translateY(-50%);
                cursor: pointer;
                opacity: 0.5;
                transition: opacity 0.2s;
            }
            .toggle-password:hover {
                opacity: 1;
            }
            .toggle-password svg {
                width: 24px;
                height: 24px;
                fill: #666;
            }

            document.addEventListener('DOMContentLoaded', function() {
                var slider = document.getElementById('periodSlider');
                var output = document.getElementById('sliderValue');
                var dateLabel = document.getElementById('dateLabel');
                var dataDisplay = document.getElementById('dataDisplay');

                var validPeriods = [];
                for (var year = 2023; year <= 2025; year++) {
                    for (var month = 1; month <= 12; month++) {
                        if (year * 100 + month < parseInt(nowPeriod)+1) {
                            validPeriods.push(year * 100 + month);
                        }
                    }
                }

                slider.max = validPeriods.length - 1; // Set the max value based on the number of valid periods

                slider.oninput = function() {
                    var periodIndex = parseInt(this.value);
                    var selectedPeriod = validPeriods[periodIndex];
                    output.innerHTML = selectedPeriod;
                    if (this.value === nowPeriod) {
                        dateLabel.innerHTML = ' (Updated: ' + processingDate + ')';
                    } else {
                        dateLabel.innerHTML = '';
                    }
                    updateDataDisplay(selectedPeriod);
                }

                slider.value = validPeriods.length - 1; // Position slider at the last period
                slider.oninput(); // Update display

                // Load the JSON data once and store it
                fetch('dashboard.json')
                    .then(response => response.json())
                    .then(data => {
                        window.dashboardData = data; // Store the data globally
                        updateDataDisplay(slider.value); // Initial display
                    });
                    
            function updateDataDisplay(periodId) {
                var currentPeriod = parseInt(periodId);
                var previousPeriod = currentPeriod - 100;

                var periodData = window.dashboardData.find(d => d.report_period_id === currentPeriod);

                if (periodData) {
                    var tableHtml = `<table>`;
                    var groups = ['MAU', 'DAU', 'Registration', 'Orders', 'Omilia', 'Self Service', 'Rating', 'Aitu Customers', 'Loyalty Program'];
                    var groupSizes = [4, 4, 6, 4, 6, 4, 2, 8, 2]; // Number of rows in each group
                    var groupEndRows = [3,7,13,16,17,21,27,31,33,35,37,39];
                    var currentGroupIndex = 0;
                    var rowCount = 0;
                    var rowCount1 = 0;

                    // Initial table headers
                    tableHtml += `<tr><th>Metric</th><th>${currentPeriod}</th><th>${previousPeriod}</th><th>Delta</th><th>Delta %</th></tr>`;
                    
                    for (var key in periodData) {
                        if (!key.endsWith('_last_year') && !key.endsWith('_delta') && !key.endsWith('_delta_pct') && key !== 'report_period_id') {
                            if (rowCount === 0 && currentGroupIndex < groups.length) {
                                // Group label
                                tableHtml += `<tr><td colspan="5" class="group-header">${groups[currentGroupIndex]}</td></tr>`;
                            }

                            var lyKey = key + '_last_year';
                            var deltaKey = key + '_delta';
                            var deltaPercentKey = key + '_delta_pct';
                            var value = formatNumber(periodData[key]);
                            var lyValue = (lyKey in periodData) ? formatNumber(periodData[lyKey]) : 'N/A';
                            var deltaValue = (deltaKey in periodData) ? formatNumber(periodData[deltaKey]) : 'N/A';
                            var deltaPercentValue = (deltaPercentKey in periodData) ? formatNumber1(periodData[deltaPercentKey]) + '%' : 'N/A';
                            var deltaClass = periodData[deltaPercentKey] > 0 ? 'positive' : (periodData[deltaPercentKey] < 0 ? 'negative' : '');
                            var displayName = columnNameMapping[key] || key;
                            
                            var rowClass = "";
                            if (groupEndRows.includes(rowCount1)) {
                                rowClass = "bold-row"; // Add class for the last row of the group
                            }
                            
                            tableHtml += `<tr class="${rowClass}"><td>${displayName}</td><td>${value}</td><td>${lyValue}</td><td>${deltaValue}</td><td class="${deltaClass}">${deltaPercentValue}</td></tr>`;
                            
                            rowCount++;
                            rowCount1++;
                            if (rowCount === groupSizes[currentGroupIndex]) {
                                currentGroupIndex++;
                                rowCount = 0;
                            }
                        }
                    }

                    tableHtml += '</table>';
                    dataDisplay.innerHTML = tableHtml;
                } else {
                    dataDisplay.innerHTML = 'Нет данных за ' + periodId + ', приходите завтра.';
                }
            }
            
            
            function formatNumber(number) {
                return number ? number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") : '0';
            }

            function formatNumber1(number) {
                if (typeof number === 'number') {
                    if (number > 0) {
                        return '+' + number.toLocaleString(undefined, {maximumFractionDigits: 2});
                    } else {
                        return number.toLocaleString(undefined, {maximumFractionDigits: 2});
                    }
                }
                return number;
            }

            function togglePassword() {
                const passwordInput = document.getElementById("password");
                const eyeOpen = document.getElementById("eye-open");
                const eyeClosed = document.getElementById("eye-closed");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    eyeOpen.style.display = "none";
                    eyeClosed.style.display = "block";
                } else {
                    passwordInput.type = "password";
                    eyeOpen.style.display = "block";
                    eyeClosed.style.display = "none";
                }
            }

            function checkPassword() {
                const password = document.getElementById("password").value;
                const PASSWORD = "Telecom_dashboard2024!"; 
                if (password === PASSWORD) {
                    document.getElementById("login-form").style.display = "none";
                    document.getElementById("protected-content").style.display = "block";
                } else {
                    alert("Неверный пароль!");
                }
            }
	    function handleEnter(event) {
                if (event.key === "Enter") {
                    checkPassword();
		}
	    }
